services:
  pg:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pwd
      - POSTGRES_DB=supportops
    volumes:
      - pg_data:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        limits:
          memory: 5g
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
volumes:
  redis:
  ollama_data:
  pg_data: 
