[project]
name = "ml-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.128.8",
    "httpx>=0.28.1",
    "redis>=7.0.1",
    "sentence-transformers>=5.1.2",
    "textblob>=0.19.0",
    "uvicorn>=0.39.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[project.scripts]
ml-worker = "worker.cli:run"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
